name: Deploy Backend to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Construir y subir la imagen de VENTAS
    - name: Build and push Ventas
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile-ventas # OJO: Asegúrate que el archivo se llame así o ajusta la ruta
        push: true
        tags: benjamin239/backend-ventas:latest

    # Construir y subir la imagen de DESPACHOS
    - name: Build and push Despachos
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile-despachos # OJO: Asegúrate que el archivo se llame así o ajusta la ruta
        push: true
        tags: benjamin239/backend-despachos:latest
